<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TP Control con IoT - Cardozo</title>
    <!-- Librería MQTT.js en lugar de Paho -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        /* Todos los textos principales con la misma fuente y tamaño unificado */
        h1, p, #tempBox {
            font-family: Arial, sans-serif;
            font-size: 2.5vw;
            font-weight: bold;
            color: #ffffff;
            width: 100%;
        }
        #tempBox {
            color: #00ffcc;
        }
        .contenedor-botones {
            display: flex;
            gap: 30px;
            width: 100%;
            justify-content: center;
        }
        button {
            padding: 20px 40px;
            font-size: 2vw;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            flex: 1;
            max-width: 300px;
        }
        .btn-abrir { background-color: #28a745; }
        .btn-cerrar { background-color: #dc3545; }

        @media (max-width: 768px) {
            h1, p, #tempBox { font-size: 5vw; }
            button { font-size: 4vw; }
            .contenedor-botones { flex-direction: column; align-items: center; }
            button { width: 80%; max-width: none; }
        }
    </style>
</head>
<body>

    <h1>TP Control con IoT - Cardozo</h1>

    <p>TEMPERATURA:</p>
    <div id="tempBox">Esperando datos...</div>

    <div class="contenedor-botones">
        <button class="btn-abrir" onclick="enviarComando('1')">ABRIR</button>
        <button class="btn-cerrar" onclick="enviarComando('0')">CERRAR</button>
    </div>

    <script>
        // Conexión mediante WebSockets usando MQTT.js (nota el prefijo 'ws://' y el puerto '8080')
        const clientId = 'web_' + Math.random().toString(16).substr(2, 8);
        const client = mqtt.connect('ws://test.mosquitto.org:8080/mqtt', { clientId: clientId });

        client.on('connect', () => {
            console.log("Conectado al broker MQTT con MQTT.js");
            client.subscribe("etusiemens/Cardozo/temperatura", (err) => {
                if (!err) {
                    console.log("Suscrito al tópico de temperatura");
                }
            });
        });

        client.on('message', (topic, payload) => {
            if (topic === "etusiemens/Cardozo/temperatura") {
                document.getElementById("tempBox").innerText = payload.toString() + " °C";
            }
        });

        function enviarComando(valor) {
            client.publish("etusiemens/Cardozo/servo", valor);
        }
    </script>
</body>
</html>
